[project]
name = "cft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "autoadsorbate @ git+https://github.com/basf/autoadsorbate@e24a51e",
    "torch~=2.9.1",
    "networkx>=3.5",
    "plyfile>=1.1.2",
    "tqdm>=4.67.1",
    # "torch-sim-atomistic~=0.5.0",
    "mace-torch~=0.3.14,"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cft"]
